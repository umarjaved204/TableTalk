# ---------------------------------------------------------------------------
# Points deductions (and restorations), as data. No deduction is ever
# hardcoded in Python.
#
# One entry per official decision, in the order they happened:
#   points        change to the team's table total: negative = deducted,
#                 positive = restored (e.g. reduced on appeal)
#   date_applied  when it took effect in the official table. A season replayed
#                 from a date (--as-of, season backtests) applies only entries
#                 dated strictly before that date, as for match results.
#   team          canonical name (configs/team_aliases.yaml)
#   source        the official statement
#
# Deductions change the overall points total only. Head-to-head criteria use
# points won in the matches between tied teams, which a deduction does not
# touch.
#
# Coverage: every season loaded for each competition below. Checked 2026-09-27.
#   premier_league 2010-11 to 2026-27: only the 2023-24 decisions below. The
#     earlier Premier League deductions (Middlesbrough 1996-97, Portsmouth
#     2009-10) fall before the data starts.
#   bundesliga 2010-11 to 2026-27: none (every final table matches the official one).
#   la_liga 2010-11 to 2026-27: Almería 2014-15 only (every other final table
#     matches the official one).
#   serie_a 2010-11 to 2026-27: the entries below. Wikipedia's tables also show
#     Lazio -1 (2017-18) and -2 (2018-19); both are errors (Lazio finished on
#     72, level with Inter, in 2017-18, and on 59 in 2018-19), so they are not here.
#   ligue_1 2010-11 to 2026-27: the entries below.
#   Not here, because the competition is never tabulated: Leicester City's six
#     points in the 2025-26 Championship (Premier League statement, 5 Feb 2026;
#     https://www.premierleague.com/en/news/4581043). Championship rows are
#     `context` data for the model only.
# ---------------------------------------------------------------------------

deductions:
  - competition: premier_league
    season: "2023-24"
    team: Everton
    points: -10
    date_applied: "2023-11-17"
    reason: Breach of Profitability and Sustainability Rules, assessment period ending 2021-22.
    source: https://www.premierleague.com/en/news/3788486

  - competition: premier_league
    season: "2023-24"
    team: Everton
    points: 4
    date_applied: "2024-02-26"
    reason: Appeal Board reduced the 10-point deduction above to 6.
    source: https://www.premierleague.com/en/news/3912574

  - competition: premier_league
    season: "2023-24"
    team: Nottingham Forest
    points: -4
    date_applied: "2024-03-18"
    reason: >-
      Breach of Profitability and Sustainability Rules, assessment period ending
      2022-23. Appeal rejected 7 May 2024 (https://www.premierleague.com/en/news/3999776).
    source: https://www.premierleague.com/en/news/3936397

  - competition: premier_league
    season: "2023-24"
    team: Everton
    points: -2
    date_applied: "2024-04-08"
    reason: >-
      Second breach of Profitability and Sustainability Rules, assessment period
      ending 2022-23. Everton's appeal was later withdrawn.
    source: https://www.premierleague.com/en/news/3960088

  - competition: la_liga
    season: "2014-15"
    team: Almería
    points: -3
    date_applied: "2015-05-26"
    reason: >-
      FIFA Disciplinary Committee sanction for a late payment to Aalborg BK
      (transfer of Michael Jakobsen). Took effect when Almería withdrew their
      appeal to the Court of Arbitration for Sport, after the last matchday.
      Source is a reprint of the CAS media release of 26 May 2015. Found by
      checking every rebuilt La Liga table against the official one.
    source: https://www.infobae.com/aroundtherings/federations/fifa/2021/07/12/ud-almera-sad-has-withdrawn-its-appeal

  # --- Serie A. Every entry found by comparing the rebuilt final tables with the
  # official ones. Dates are when the decision took effect; where only an
  # approximate date was found, the reason says so.
  - competition: serie_a
    season: "2010-11"
    team: Bologna
    points: -1
    date_applied: "2010-12-02"
    reason: Unpaid IRPEF tax withholdings on players' wages (May-June 2010).
    source: https://sport.sky.it/calcio/2010/12/02/bologna_fan_club_penalizzazione_porcedda_inibito
  - competition: serie_a
    season: "2010-11"
    team: Bologna
    points: -2
    date_applied: "2011-05-22"
    reason: >-
      A further 2 points (the season's total was 3). DATE NOT FOUND: recorded at
      the last matchday; 2010-11 is not replayed in any backtest.
    source: https://it.wikipedia.org/wiki/Bologna_Football_Club_1909_2010-2011
  - competition: serie_a
    season: "2011-12"
    team: Atalanta
    points: -6
    date_applied: "2011-08-09"
    reason: 2011 betting scandal (calcioscommesse); decided before the season.
    source: https://en.wikipedia.org/wiki/2011%E2%80%9312_Italian_football_scandal
  - competition: serie_a
    season: "2012-13"
    team: Siena
    points: -6
    date_applied: "2012-08-22"
    reason: 2011-12 betting scandal; imposed in August 2012, before the season (approximate date).
    source: https://it.wikipedia.org/wiki/Serie_A_2012-2013
  - competition: serie_a
    season: "2012-13"
    team: Atalanta
    points: -2
    date_applied: "2012-08-22"
    reason: 2011-12 betting scandal; imposed in August 2012, before the season (approximate date).
    source: https://it.wikipedia.org/wiki/Serie_A_2012-2013
  - competition: serie_a
    season: "2012-13"
    team: Sampdoria
    points: -1
    date_applied: "2012-08-22"
    reason: 2011-12 betting scandal; imposed in August 2012, before the season (approximate date).
    source: https://it.wikipedia.org/wiki/Serie_A_2012-2013
  - competition: serie_a
    season: "2012-13"
    team: Torino
    points: -1
    date_applied: "2012-08-22"
    reason: 2011-12 betting scandal; imposed in August 2012, before the season (approximate date).
    source: https://it.wikipedia.org/wiki/Serie_A_2012-2013
  - competition: serie_a
    season: "2014-15"
    team: Parma
    points: -1
    date_applied: "2014-12-09"
    reason: Partial payment of IRPEF tax withholdings.
    source: https://it.wikipedia.org/wiki/Parma_Football_Club_2014-2015
  - competition: serie_a
    season: "2014-15"
    team: Parma
    points: -4
    date_applied: "2015-02-16"
    reason: >-
      Unpaid wages. The official final table (19 points) implies 7 points in
      total; the Italian Wikipedia's breakdown adds to 8, so how the February
      and March decisions split is uncertain.
    source: https://it.wikipedia.org/wiki/Parma_Football_Club_2014-2015
  - competition: serie_a
    season: "2014-15"
    team: Parma
    points: -2
    date_applied: "2015-03-14"
    reason: Unpaid wages (further sanction).
    source: https://it.wikipedia.org/wiki/Parma_Football_Club_2014-2015
  - competition: serie_a
    season: "2018-19"
    team: Chievo Verona
    points: -3
    date_applied: "2018-09-13"
    reason: False accounting (inflated transfer valuations).
    source: https://www.football-italia.net/127901/chievo-get-three-point-deduction
  - competition: serie_a
    season: "2022-23"
    team: Juventus
    points: -15
    date_applied: "2023-01-20"
    reason: Inflated transfer valuations (plusvalenze); FIGC Federal Court of Appeal.
    source: https://www.goal.com/it/notizie/caso-plusvalenze-stangata-per-la-juve-15-punti-di-penalizzazione/blt74200fd78d68d1d6
  - competition: serie_a
    season: "2022-23"
    team: Juventus
    points: 15
    date_applied: "2023-04-20"
    reason: CONI Guarantee Board annulled the -15 and sent the case back.
    source: https://www.corrieredellosport.it/news/calcio/serie-a/juve/processo-juventus/2023/04/20-106711098/sentenza_juve_clamoroso_ridati_i_15_punti_cosa_succede_adesso
  - competition: serie_a
    season: "2022-23"
    team: Juventus
    points: -10
    date_applied: "2023-05-22"
    reason: FIGC Federal Court of Appeal's new sanction in the plusvalenze case.
    source: https://sport.sky.it/calcio/serie-a/2023/05/22/juve-plusvalenze-sentenza-processo-news

