# ---------------------------------------------------------------------------
# Team-name normalisation map.
#
# Different sources spell the same club differently ("Man United",
# "Manchester Utd", "Manchester United FC"). Every loader passes its raw names
# through TeamNameNormaliser, which resolves them to the canonical name below.
#
# Format:
#   canonical name:
#     - alias
#     - another alias
#
# Matching is case-insensitive and ignores punctuation, accents and common
# suffixes (FC, CF, AFC, ...), so you only need to list genuinely different
# spellings, not every capitalisation. Unknown names are reported by
# `python -m tabletalk data check`, which is the intended workflow when adding
# a new source: run it, then add the missing aliases here.
#
# Canonical names are the club's usual full English-language name.
# ---------------------------------------------------------------------------

teams:
