# Dependabot: once a week, a pull request per ecosystem with any newer versions.
# Nothing changes until a pull request is merged, and the nightly run only ever
# uses what is merged on main (actions pinned by commit SHA, Python libraries by
# hash in requirements-lock.txt).
#
# Cooldown: a version update is proposed only once the release is 14 days
# old (the project's rule for actions and packages), so a bad or hijacked
# release has time to be noticed and pulled. It applies to version updates
# only; Dependabot security updates are never delayed (GitHub's docs, checked
# 22 Oct 2026).
version: 2
updates:
  # The actions in .github/workflows/ (pinned to full commit SHAs; Dependabot
  # updates the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # requirements-lock.txt, compiled from requirements-lock.in by pip-tools
  # (Dependabot re-runs the command in the file's header). pyproject.toml and
  # requirements.txt hold the same libraries as lower bounds only.
  - package-ecosystem: pip
    directory: /
    # Only the lock moves; the lower bounds (kept the same in pyproject.toml
    # and requirements-lock.in, a test checks) stay as they are.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]

  # The website (web/), on main since the website merge.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      website:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is not yet supported by @astrojs/check and
      # typescript-eslint; move to it by hand once they support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types must match the Node version the site runs on (24, web/.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Wrangler for the deploy job (deploy/package.json, one exact version).
  # Review like an action update: read the release notes.
  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      deploy:
        patterns: ["*"]
