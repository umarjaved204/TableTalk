# Nightly update: fetch -> check -> refit -> simulate -> lock -> publish.
#
# Publishes to the `data` branch of this repository (storage option A, chosen
# 2026-09-29). Only the bot (github-actions[bot]) commits there; `main` is never
# written by this workflow. Each commit on `data` is one run. The branch is
# protected (ruleset `protect-data`: no force-pushes, no deletion), so its
# public history is strong evidence of when every prediction was published.
#
# Two jobs, so the job with the secret cannot push and the job that can push
# never sees the secret or runs the project's code (hardening F-04):
#
#   update   contents: read. Has FOOTBALL_DATA_API_KEY, installs the locked
#            libraries, runs the model. Commits the new outputs locally and
#            hands over just that one commit (a git bundle) and the data
#            commit it started from.
#   publish  contents: write. No API key, no Python, no pip. Runs
#            scripts/check_publish.sh: one commit on top of that starting
#            point, allowed paths only, history and the lock log append-only,
#            the raw-download record add-only; then pushes.
#
# Timing: the earliest kick-off in the five leagues is 10:30 UTC (Serie A,
# 12:30 in Italy in summer; 11:30 UTC in winter). GitHub starts scheduled runs
# late when it is busy, with no promised limit, and can drop them: in the
# first days (30 Sep and 1 Oct 2026) runs started 6 to 7 hours after their
# scheduled time. So there are four tries a day, two hours apart, from 01:37
# UTC (off the hour, GitHub's busiest moment). Every scheduled try uses
# --skip-if-updated-today: the first one GitHub actually starts does the
# update; the others stop in seconds if the day is done. Done means every
# league updated AND no match that kicked off 3+ hours before the run is
# missing its final score (state/run_state.json on the data branch). If not,
# the next try runs the whole update again (unchanged leagues get the same
# numbers with a newer predicted_at).
#
# The last try (LAST_TRY_SCHEDULE below) passes --last-try: if results are
# still missing then, it publishes, warns and fails the job so you are told.
# Two known cases: GitHub can start tries out of order (the 07:37 try running
# before the 05:37 one can send a false-alarm email, and the 05:37 try then
# still runs and can complete the day); and a dropped 07:37 try means no email
# that day (the run report and the 2-day "results may be late" check still
# catch a lasting gap).
#
# Failures: the run fails (and GitHub emails whoever last changed the `cron`
# lines) when a league fails its checks, results look late, results are still
# missing on the last try, locking fails, the raw-download record finds a
# changed old file, or the publish checks refuse the commit. Whatever did pass
# is still published first; a failed league keeps its previous files.
#
# Actions are pinned to full commit SHAs (the version is in the comment), so a
# moved tag cannot change what runs (hardening F-05). Values from the event
# reach shell scripts only through `env:`, never pasted into `run:` (F-15).
#
# Needs one repository secret: FOOTBALL_DATA_API_KEY. The `data` branch must
# already exist.

name: Daily update

on:
  schedule:
    # 01:37, 03:37, 05:37 and 07:37 UTC. The first that GitHub starts does the
    # update; the rest skip if it updated every league. One line per try, so
    # each run records which try it was (github.event.schedule) and its delay
    # can be measured.
    - cron: "37 1 * * *"
    - cron: "37 3 * * *"
    - cron: "37 5 * * *"
    - cron: "37 7 * * *"   # the last try: must equal LAST_TRY_SCHEDULE below
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's run already updated every league with complete results"
        type: boolean
        default: false

# Nothing by default: each job asks for exactly what it needs.
permissions: {}

# The one place the last try is defined (a test checks it is the latest cron
# line above). Manual runs are never the last try.
env:
  LAST_TRY_SCHEDULE: "37 7 * * *"

# Never two runs at once: both would append to the lock log and push to
# `data`. Tries that overlap queue instead (GitHub keeps the newest waiting
# one; every try follows the same skip rule, so losing a waiting one is safe).
# At workflow level, so a run's update and publish jobs queue as one unit.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # Pinned, not ubuntu-latest, so the runner image cannot change under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_bundle: ${{ steps.bundle.outputs.has_bundle }}
      base_sha: ${{ steps.data.outputs.base_sha }}
    steps:
      # Which try this is and when it really started, for measuring delays.
      - name: Show which schedule started this run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT"
          echo "Schedule: ${SCHEDULE:-none (not a scheduled run)}"
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # No credentials are kept: this job never pushes.
      - name: Check out the code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Exact versions with their hashes (requirements-lock.txt, made by
      # pip-compile for Linux and Python 3.13), so a new or tampered release on
      # PyPI cannot change what runs. Then the project itself, resolving nothing.
      - name: Install
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .

      # Past seasons never change, so keep the raw downloads between runs. The
      # current season is downloaded fresh every time regardless. The cache is
      # checked against the record on the data branch before it is used.
      - name: Restore cached raw data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The published files, including the lock store, live on the `data`
      # branch (public, so no credentials needed to read it). Check it out
      # into outputs/ so this run continues from them.
      - name: Check out the published data (data branch -> outputs/)
        id: data
        run: |
          if ! git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "::error::No data branch: create it once by hand before the first run."
            exit 1
          fi
          git fetch --depth=1 origin data
          git worktree add --detach outputs FETCH_HEAD
          echo "base_sha=$(git -C outputs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keep only cached files whose hash is in state/raw_manifest.sha256 (all
      # of them deleted if there is no record yet); the update downloads the
      # rest again (hardening F-17).
      - name: Check the raw cache against the record
        run: python -m tabletalk raw-cache prepare --out outputs

      - name: Run the update
        id: update
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
        run: |
          # Every scheduled try skips if the day is done (every league updated,
          # no results missing); a manual run does too, unless "force" is ticked.
          skip=""
          last=""
          if [ "$EVENT" = "schedule" ]; then
            skip="--skip-if-updated-today"
            if [ "$SCHEDULE" = "$LAST_TRY_SCHEDULE" ]; then
              last="--last-try"
            fi
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" != "true" ]; then
            skip="--skip-if-updated-today"
          fi
          set +e
          python -m tabletalk update --out outputs $skip $last
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Add new past-season downloads to the record; a recorded file that now
      # differs fails the run (the record keeps the original).
      - name: Record new raw downloads
        id: raw
        if: always() && steps.data.outcome == 'success'
        run: |
          set +e
          python -m tabletalk raw-cache record --out outputs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Publish whatever passed, even if something else failed: a failed
      # league keeps its previous files, and the others should not wait for it.
      # The commit is made here but pushed by the publish job.
      - name: Commit the new outputs (locally) and bundle them
        id: bundle
        if: always() && steps.data.outcome == 'success'
        env:
          BASE: ${{ steps.data.outputs.base_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd outputs
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "has_bundle=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Nightly update $(date -u +%Y-%m-%dT%H:%MZ)" -m "Run: $RUN_URL"
          git bundle create "$RUNNER_TEMP/data.bundle" HEAD "^$BASE"
          echo "has_bundle=true" >> "$GITHUB_OUTPUT"

      - name: Hand the commit to the publish job
        if: always() && steps.bundle.outputs.has_bundle == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-bundle
          path: ${{ runner.temp }}/data.bundle
          if-no-files-found: error
          retention-days: 7

      - name: Show the run report
        if: always()
        run: |
          if [ -f outputs/latest/run_report.md ]; then
            cat outputs/latest/run_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/track_record/report.md ]; then
            cat outputs/track_record/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the job if the update failed or flagged anything
        if: always()
        env:
          CODE: ${{ steps.update.outputs.exit_code }}
          RAW_CODE: ${{ steps.raw.outputs.exit_code }}
        run: |
          if [ "$CODE" != "0" ]; then
            echo "::error::The update exited with $CODE: see the run report above."
            exit 1
          fi
          if [ "$RAW_CODE" != "0" ]; then
            echo "::error::The raw-download record found a problem (exit $RAW_CODE): see the step log."
            exit 1
          fi

  publish:
    needs: update
    # Also after a failed update: whatever passed is published.
    if: ${{ !cancelled() && needs.update.outputs.has_bundle == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # to push to the `data` branch
    steps:
      # Only the check script, and no stored credentials.
      - name: Check out the publish checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check_publish.sh
          sparse-checkout-cone-mode: false

      - name: Fetch the update job's commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-bundle
          path: ${{ runner.temp }}/bundle

      - name: Check the commit and push it to the data branch
        env:
          BASE: ${{ needs.update.outputs.base_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_publish.sh "$RUNNER_TEMP/bundle/data.bundle"
