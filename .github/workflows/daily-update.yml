# Nightly update: fetch -> check -> refit -> simulate -> lock -> publish.
#
# Publishes to the `data` branch of this repository (storage option A, chosen
# 2026-09-29). Only the bot (github-actions[bot]) commits there; `main` is never
# written by this workflow. Each commit on `data` is one run. The branch is
# protected (ruleset `protect-data`: no force-pushes, no deletion), so its
# public history is strong evidence of when every prediction was published.
#
# Timing: the earliest kick-off in the five leagues is 10:30 UTC (Serie A,
# 12:30 in Italy in summer; 11:30 UTC in winter). GitHub starts scheduled runs
# late when it is busy, with no promised limit, and can drop them: in the
# first days (30 Sep and 1 Oct 2026) runs started 6 to 7 hours after their
# scheduled time. So there are four tries a day, two hours apart, from 01:37
# UTC (off the hour, GitHub's busiest moment). Every scheduled try uses
# --skip-if-updated-today: the first one GitHub actually starts does the
# update; the others see that today's run updated every league and stop in
# seconds. If that run failed or flagged a league, the next try runs again.
# 01:37 is about three hours after the last evening matches end (~22:45 UTC),
# so the previous night's results should be in.
#
# Failures: the job fails (and GitHub emails whoever last changed the `cron`
# lines) when a league fails its checks, results look late, or locking fails.
# Whatever did pass is still published first; a failed league keeps its
# previous files.
#
# Needs one repository secret: FOOTBALL_DATA_API_KEY.

name: Daily update

on:
  schedule:
    # 01:37, 03:37, 05:37 and 07:37 UTC. The first that GitHub starts does the
    # update; the rest skip if it updated every league. One line per try, so
    # each run records which try it was (github.event.schedule) and its delay
    # can be measured.
    - cron: "37 1 * * *"
    - cron: "37 3 * * *"
    - cron: "37 5 * * *"
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's run already updated every league"
        type: boolean
        default: false

permissions:
  contents: write   # to push to the `data` branch

# Never two runs at once: both would push to `data`.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # Pinned, not ubuntu-latest, so the runner image cannot change under us
    # (ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026, during the trial).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Actions are pinned to exact releases (all on Node 24), so their code
    # cannot change during the trial either.
    steps:
      # Which try this is and when it really started, for measuring delays.
      - name: Show which schedule started this run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT"
          echo "Schedule: ${SCHEDULE:-none (not a scheduled run)}"
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Check out the code (main)
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Past seasons never change, so keep the raw downloads between runs. The
      # current season is downloaded fresh every time regardless.
      - name: Restore cached raw data
        uses: actions/cache@v6.1.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The published files, including the lock store, live on the `data`
      # branch. Check it out into outputs/ so this run continues from them.
      - name: Check out the published data (data branch -> outputs/)
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add outputs FETCH_HEAD
          else
            echo "No data branch yet: this is the first run, starting a new one."
            git worktree add --detach outputs
            git -C outputs checkout --orphan data-new
            git -C outputs rm -rf --quiet .
          fi

      - name: Run the update
        id: update
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          # Every scheduled try skips if today's run already updated every
          # league; a manual run does too, unless "force" is ticked.
          skip=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            skip="--skip-if-updated-today"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ]; then
            skip="--skip-if-updated-today"
          fi
          set +e
          python -m tabletalk update --out outputs $skip
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Publish whatever passed, even if something else failed: a failed
      # league keeps its previous files, and the others should not wait for it.
      - name: Publish to the data branch
        if: always()
        run: |
          cd outputs
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Nightly update $(date -u +%Y-%m-%dT%H:%MZ)" \
                             -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:refs/heads/data

      - name: Show the run report
        if: always()
        run: |
          if [ -f outputs/latest/run_report.md ]; then
            cat outputs/latest/run_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/track_record/report.md ]; then
            cat outputs/track_record/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the job if the update failed or flagged anything
        if: always()
        run: |
          code="${{ steps.update.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::The update exited with $code: see the run report above."
            exit 1
          fi
